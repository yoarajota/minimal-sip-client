id: C-004
slug: minimal-sip-client
title: "Minimal SIP client: what RFC 3261 subset is sufficient to register and hold a call with a real PBX?"
archetype: implementation
phase: P2
status: active

# The stack is declared explicitly so gate commands and verification paths are concrete
# rather than assumed. Any language is valid.
stack:
  language: Go
  build_tool: make
  test_runner: go test
  quality_runner: "make quality"   # must match quality-gates.yaml -> iso5055.runner

summary: >
  A from-scratch SIP client that implements only the RFC 3261 subset needed to register,
  establish, hold, and tear down a two-way RTP call against a mainstream PBX, and measures
  how much of the specification that subset actually is.

question: "What subset of RFC 3261 is necessary and sufficient for a from-scratch SIP client to register, establish, and tear down a two-way RTP call against a mainstream PBX?"

domain:
  - voip
  - networking

# P0 selection screen. Every field must survive the question "is this a tautology?".
screen:
  problem_class: >
    Selecting the minimum normative subset of a large signaling protocol that suffices for a
    real, two-way media session against a mainstream implementation — here, SIP (RFC 3261)
    against a PBX.
  incumbent: >
    PJSIP, the mainstream full SIP stack, at a pinned version. People use the full stack
    because SIP is assumed too large to implement partially. It falls short as an answer to
    this question because it implements the entire RFC 3261 surface, so it cannot show which
    parts a working client actually needs.
  falsifier: >
    If the smallest RFC 3261 subset that completes the scenario suite (register, two-way RTP
    call, hold/resume, teardown against Asterisk) still implements a majority of RFC 3261's
    normative MUST requirements, the concept is falsified: a "minimal" client is not
    meaningfully smaller than a full stack, so SIP's complexity is intrinsic rather than
    incidental.
  complexity_justification: >
    The machinery — a from-scratch SIP/RTP client plus a message-trace matrix mapping each
    required behaviour to the RFC section that forces it — is warranted because the claim is
    about which parts of a standard are load-bearing, and that can only be established by
    implementing the minimal set and recording which sections the scenario suite forces.

baseline:
  name: PJSIP
  version: "2.17"
  url: https://github.com/pjsip/pjproject
  why: >
    PJSIP is the mainstream full SIP stack behind real clients. The interesting result is not
    "a minimal client works" but "a minimal client is meaningfully smaller than the full stack
    while completing the same scenario suite", which requires the full stack as the honest
    point of comparison.

hypotheses:
  - id: H-001
    statement: >
      Under the scenario suite (register, two-way RTP call, hold/resume, teardown against a
      pinned Asterisk version), a from-scratch SIP client requires fewer than half of RFC 3261's
      normative MUST requirements to complete the same suite that PJSIP 2.17 completes in full,
      at the cost of not supporting SIP features outside the suite (forking, presence,
      subscription).
    verdict: untested
    evidence_refs: []
    revisions: []

# Set once the remote exists (bootstrap step 3). Required only at G6, so it stays
# null until then rather than blocking every earlier gate as a placeholder.
repo_url: https://github.com/yoarajota/minimal-sip-client
created: "2026-08-14"
updated: "2026-08-14"
