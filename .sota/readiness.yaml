integrations:
- from: core
  to: asterisk
  irl: 5
  rationale: 'RFC 3261 over UDP 5060 plus RTP (PCMU) — protocol and contract named (D-001, README public
    interface, matrix) and exercised end-to-end against the real pinned PBX (E-004): register, call, hold/resume,
    teardown. Error semantics defined and unit-tested (timeouts 64xT1 -> 408, Timer E retransmission,
    CSeq idempotency, 401 digest retry on REGISTER and INVITE — E-003). Lifecycle handled in code (connect
    via probe+register, dialog manage via re-INVITE, terminate via BYE + Close, resource release on stream/conn
    close) and exercised in the suite. Blocked from IRL 6: single codec, single concurrent call — end-to-end
    flow under realistic volumes and edge encodings is unexercised, and there is no fault injection against
    the real PBX (unit-tier faults run against the fake UAS only).

    '
