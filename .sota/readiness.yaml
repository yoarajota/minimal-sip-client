components:
  - id: core
    role: concept          # concept | supporting | host | dataset | tooling
    trl: 1
    evidence_refs: [E-001]
    notes: >
      The from-scratch SIP client: a minimal RFC 3261 implementation (register, call
      establishment, hold/resume, teardown) carrying RTP media, plus the message-trace matrix
      that maps each implemented behaviour to the RFC section forcing it. TRL 1: the concept is
      defined and the P0 screen is written; nothing is implemented yet, so the claim rests on
      the screen rather than on run evidence.

