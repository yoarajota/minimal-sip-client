  irl: 4
  rationale: 'The host seam: the compiled client runs inside the golang:1.22-alpine container and the
    suite exits with the client''s exit code (compose --exit-code-from client, propagated by run-suite.sh).
    Contract documented (README Try it, Makefile suite target); error semantics defined (exit 0 = suite
    passed, non-zero otherwise). Blocked from IRL 5: the container''s shutdown path (SIGTERM handling,
