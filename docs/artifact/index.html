<script id="artifact-data" type="application/json">{"meta": {"concept_id": "C-004", "slug": "minimal-sip-client", "title": "Minimal SIP client: what RFC 3261 subset is sufficient to register and hold a call with a real PBX?", "question": "What subset of RFC 3261 is necessary and sufficient for a from-scratch SIP client to register, establish, and tear down a two-way RTP call against a mainstream PBX?", "status": "supported", "phase": "P6", "archetype": "implementation", "domain": ["voip", "networking"], "repo_url": "https://github.com/yoarajota/minimal-sip-client", "created": "2026-08-14", "updated": "2026-08-14", "generated_at": "2026-08-15", "input_digest": "fe0de7b51642d089"}, "pitch": {"one_line_answer": "A from-scratch SIP client needs only 90 of RFC 3261's 540 normative must-statements (16.7%) to register, call, hold, resume and hang up against a real PBX — and resumes a held call's media where the reference stack's own API cannot (E-007, E-008).\n", "elevator": "SIP (RFC 3261) is a 300-page protocol, and a production stack carries all of it: forking, presence, encryption, timers, retransmissions, S/MIME. This repository asks how much of that is actually load-bearing for one ordinary job — a client that registers with a PBX, makes a two-way audio call, puts it on hold, brings it back, and hangs up. We built that client from zero, with no SIP library, and then enumerated, statement by statement, which of the protocol's normative requirements the scenarios actually force. The answer: 90 of 540, or 16.7% (E-007). The reference stack, PJSIP 2.17, completes the same suite — and its own high-level API cannot restart a held call's media without a sound device, while the 1,100-line client here can (E-008).\n"}, "verdict": {"hypotheses": [{"id": "H-001", "statement": "Under the scenario suite (register, two-way RTP call, hold/resume, teardown against a pinned Asterisk version), a from-scratch SIP client requires fewer than half of RFC 3261's normative MUST requirements ": "asterisk", "role": "supporting", "trl": 9, "srl": 0.6852}, {"id": "client-runtime", "role": "host", "trl": 5, "srl": 0.4259}], "integrations": [{"from": "core", "to": "asterisk", "irl": 5, "note": "RFC 3261 over UDP 5060 plus RTP (PCMU) — protocol and contract named (D-001, README public interface, matrix) and exercised end-to-end against the real pinned PBX (E-004): register, call, hold/resume, teardown. Error semantics defined and unit-tested (timeouts 64xT1 -> 408, Timer E retransmission, CSeq idempotency, 401 digest retry on REGISTER and INVITE — E-003). Lifecycle handled in code (connect via probe+register, dialog manage via re-INVITE, terminate via BYE + Close, resource release on stream/conn close) and exercised in the suite. Blocked from IRL 6: single codec, single concurrent call — end-to-end flow under realistic volumes and edge encodings is unexercised, and there is no fault injection against the real PBX (unit-tier faults run against the fake UAS only).\n"}, {"from": "core", "to": "client-runtime", "irl": 4, "note": "The host seam: the compiled client runs inside the golang:1.22-alpine container and the suite exits with the client's exit code (compose --exit-code-from client, propagated by run-suite.sh). Contract documented (README Try it, Makefile suite target); error semantics defined (exit 0 = suite passed, non-zero otherwise). Blocked from IRL 5: the container's shutdown path (SIGTERM handling, drain of an in-flight call before exit) is untested — compose stops the container after the suite finishes, so graceful termination at the host seam is not proven.\n"}], "weakest": "core\u003c->client-runtime (IRL 4)", "scenarios": [{"id": "S-001", "characteristic": "functional-suitability", "priority": "high", "status": "pass"}, {"id": "S-002", "characteristic": "reliability", "priority": "high", "status": "pass"}, {"id": "S-003", "characteristic": "maintainability", "priority": "medium", "status": "pass"}], "diffusion": {"scores": [{"attribute": "relativ <script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = sel => document.querySelector(sel);

function chip(verdict, small) {
  const known = ["supported", "partially-supported", "falsified", "untested"];
  const cls = known.includes(verdict) ? verdict : (verdict === "active" ? "active" : "state");
  const label = verdict.replace(/-/g, " ");
  return `<span class="chip ${esc(cls)}${small ? " chip-small" : ""}" aria-label="Status: ${label}">${esc(label)}</span>`;
}

function statusChip(status) {
  return `<span class="chip chip-small status-${esc(status)}">${esc(status)}</span>`;
}

const DIFF_NAMES = { "relative_advantage": "clear advantage over what people use today",
                     "compatibility": "fits existing setups",
                     "simplicity": "easy to understand and adopt",
                     "trialability": "easy to try out",
                     "observability": "you can see it working" };

function diffChip(attribute, score) {
  return `<span class="chip chip-small diff-${esc(score)}">${esc(DIFF_NAMES[attribute] || attribute)} · ${esc(score)}</span>`;
}

function gauge(label, level, noteText) {
  const pct = (level / 9) * 100;
  return `<div class="gauge" role="img" aria-label="${esc(label)} ${level} of 9">
    <div class="gauge-head">
      <span class="gauge-name mono">${esc(label)}</span>
      <span class="gauge-level">${level}<span class="gauge-max">/9</span></span>
      <span class="gauge-note">${esc(noteText)}</span>
    </div>
    <div class="gauge-track"><div class="gauge-fill" style="width:${pct}%"></div></div>
  </div>`;
}

function chart(d) {
  const W = 720, H = 300, L = 52, R = 16, T = 16, B = 38;
  const depths = d.series.flatMap(s => s.points.map(p => p[0])).concat((d.x_ticks || []).map(t => t[1]));
  const positive = depths.filter(v => v > 0);
  const x0 = Math.log10(Math.min(...positive)), x1 = Math.log10(Math.max(...positive));
  const px = depth => {
    const v = depth > 0 ? Math.log10(depth) : x0 - 0.45 * (x1 - x0);
    return L + Math.max(0, Math.min(1, (v - x0) / (x1 - x0))) * (W - L - R);
  };
  if (!positive.length) { return ""; }
  const py = v => T + Math.max(0, Math.min(1, 1 - v / d.ymax)) * (H - T - B);
  const gridX = d.x_ticks.map(([label, depth]) =>
    `<line class="chart-grid" x1="${px(depth)}" y1="${T}" x2="${px(depth)}" y2="${H - B}"/>`).join("");
  const gridY = d.y_ticks.map(v =>
    `<line class="chart-grid" x1="${L}" y1="${py(v)}" x2="${W - R}" y2="${py(v)}"/>`).join("");
  const labelsX = d.x_ticks.map(([label, depth]) =>
    `<text class="chart-axis" x="${px(depth)}" y="${H - B + 18}" text-anchor="middle">${esc(label)}</text>`).join("");
  const labelsY = d.y_ticks.map(v =>
    `<text class="chart-axis" x="${L - 8}" y="${py(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const paths = d.series.map(s => {
    const pts = s.points.map(p => `${px(p[0])},${py(p[1])}`).join(" ");
    const cls = s.kind === "concept" ? "chart-concept" : "chart-baseline";
    const dots = s.kind === "concept" ? s.points.map(p =>
      `<circle class="chart-concept-dot" cx="${px(p[0])}" cy="${py(p[1])}" r="3.2"/>`).join("") : "";
    return `<polyline class="${cls}" points="${pts}" fill="none"/>${dots}`;
  }).join("");
  const co = d.crossover
    ? `<line class="chart-crossover" x1="${px(d.crossover.depth)}" y1="${T}" x2="${px(d.crossover.depth)}" y2="${H - B}"/>
    <text class="chart-crossover-label" x="${px(d.crossover.depth)}" y="${T + 12}" text-anchor="middle">${esc(d.crossover.label)}</text>`
    : "";
  const legend = d.series.map(s =>
    `<span class="legend-item"><span class="legend-swatch ${s.kind === "concept" ? "legend-concept" : "legend-baseline"}"></span>${esc(s.name)}</span>`).join("");
  return `<div class="chart">
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.title)}">
      ${gridX}${gridY}${labelsX}${labelsY}${co}${paths}
    </svg>
    <div class="chart-legend mono">${legend}</div>
    <p class="chart-caption mono">${esc(d.caption)}</p>
  </div>`;
}

render();

const body = document.body;
const key = "artifact-ink";
try { if (localStorage.getItem(key) === "1") body.classList.add("ink"); } catch (e) {}
$("#toggle").setAttribute("aria-pressed", body.classList.contains("ink") ? "true" : "false");
$("#toggle").addEventListener("click", () => {
  body.classList.toggle("ink");
  $("#toggle").setAttribute("aria-pressed", body.classList.contains("ink") ? "true" : "false");
  try { localStorage.setItem(key, body.classList.contains("ink") ? "1" : "0"); } catch (e) {}
});
</script>
</body>
</html>
