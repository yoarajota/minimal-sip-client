    - generic [ref=e4]:
      - paragraph [ref=e5]: VOIP — NETWORKING
      - 'heading "Minimal SIP client: what RFC 3261 subset is sufficient to register and hold a call with a real PBX?" [level=1] [ref=e6]'
      - paragraph [ref=e7]: What subset of RFC 3261 is necessary and sufficient for a from-scratch SIP client to register, establish, and tear down a two-way RTP call against a mainstream PBX?
      - generic [ref=e8]:
        - 'generic "Status: supported" [ref=e9]': supported
        - paragraph [ref=e10]: A from-scratch SIP client needs only 90 of RFC 3261's 540 normative must-statements (16.7%) to register, call, hold, resume and hang up against a real PBX — and resumes a held call's media where the reference stack's own API cannot (E-007, E-008).
    - paragraph [ref=e11]: "SIP (RFC 3261) is a 300-page protocol, and a production stack carries all of it: forking, presence, encryption, timers, retransmissions, S/MIME. This repository asks how much of that is actually load-bearing for one ordinary job — a client that registers with a PBX, makes a two-way audio call, puts it on hold, brings it back, and hangs up. We built that client from zero, with no SIP library, and then enumerated, statement by statement, which of the protocol's normative requirements the scenarios actually force. The answer: 90 of 540, or 16.7% (E-007). The reference stack, PJSIP 2.17, completes the same suite — and its own high-level API cannot restart a held call's media without a sound device, while the 1,100-line client here can (E-008)."
