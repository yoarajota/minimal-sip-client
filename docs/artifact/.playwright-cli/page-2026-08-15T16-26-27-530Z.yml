    - generic [ref=e135]:
      - heading "The story" [level=2] [ref=e136]
      - generic [ref=e137]:
        - article [ref=e138]:
          - heading "Theory" [level=3] [ref=e139]
          - heading "What the protocol actually demands" [level=4] [ref=e140]
          - paragraph [ref=e141]: "A full survey of RFC 3261 found 590 normative must-occurrences across every section — and a suspicion that almost none of them are needed for an ordinary call. The falsification line was fixed in advance: if completing the suite forces a majority of them, the claim is wrong."
        - article [ref=e142]:
          - heading "Proof of concept" [level=3] [ref=e143]
          - heading "A working call against a real PBX" [level=4] [ref=e144]
          - paragraph [ref=e145]: The first client registered, called, held, resumed and tore down against a real Asterisk container — media flowed both ways (152/152). That proved the scenario suite was completable, not that the subset was small.
        - article [ref=e146]:
          - heading "The component" [level=3] [ref=e147]
          - heading "A client worth auditing" [level=4] [ref=e148]
          - paragraph [ref=e149]: "The client was rebuilt as a small, auditable component with the wire trace recorded on every message — and the trace became the instrument: each behaviour carries the RFC section that forces it, so the subset is enumerable rather than asserted."
        - article [ref=e150]:
          - heading "The measurement" [level=3] [ref=e151]
          - heading "Counting what the suite forces" [level=4] [ref=e152]
          - paragraph [ref=e153]: The enumeration came in at 90 of 540 statements (16.7%), with two stricter counting rules also far under the line. The 590-occurrence text never needed to be reached — the claim held under the rule that should have caught inflation.
        - article [ref=e154]:
          - heading "The comparison" [level=3] [ref=e155]
          - heading "The incumbent, run head to head" [level=4] [ref=e156]
          - paragraph [ref=e157]: "PJSIP 2.17 built from source, same suite, same PBX, five runs each — and one genuine finding: its high-level API cannot restart a held call's media headless. The client here can, and the limitation is reported rather than tuned away."
      - generic [ref=e158]:
        - heading "WHAT WE TRIED THAT DIDN'T WORK" [level=3] [ref=e159]
        - article [ref=e160]:
          - heading "The INVITE that forgot its body" [level=4] [ref=e161]
          - paragraph [ref=e162]: "The first client sent its INVITE with Content-Length: 0 — no SDP at all. The call \"succeeded\" and no media ever flowed. Only the integration suite against the real PBX caught it; the regression test that guards it now is part of the suite (E-004)."
        - article [ref=e163]:
          - heading "The re-INVITE that collided with itself" [level=4] [ref=e164]
          - paragraph [ref=e165]: A hold re-INVITE reused the CSeq of the initial INVITE after the digest retry — the PBX answered 491 Request Pending. The dialog CSeq has to be the one actually used on the wire, not the one the code intended. A property test now pins the invariant.
        - article [ref=e166]:
          - heading "The baseline that could not come back from hold" [level=4] [ref=e167]
          - paragraph [ref=e168]: "Getting PJSIP 2.17's Python API to restart a held call's media headless ate the longest debug stretch of the comparison: its unhold offers a port-0 loopback (488), media re-initialisation crashes, and a manual offer leaves the stream inactive. The endpoint is a documented limitation (E-008), not a fix — and the client here does the step the incumbent cannot."
    - generic [ref=e169]:
      - heading "What we learned" [level=2] [ref=e170]
      - list [ref=e171]:
        - listitem [ref=e172]: "A protocol standard is not a load-bearing surface: most of RFC 3261's normative requirements exist for deployments this scenario cannot touch — proxies, forking, encryption, presence, S/MIME."
        - listitem [ref=e173]: "Deciding the falsifier before measuring is what keeps the result honest: at 16.7%, the temptation is to loosen the counting; the pre-registered 50% line is why nobody can accuse the number of being tuned."
        - listitem [ref=e174]: "Running the incumbent under the same conditions is a measurement instrument of its own: it surfaced a real pjsua2 limitation (no headless media restart) that no amount of code reading would have found."
        - listitem [ref=e175]: "Record the wire, not the intention: the message trace turned a pass/fail suite into an audit trail, and that trail is the paper backing every number in this repository."
    - generic [ref=e176]:
      - heading "Where this falls short" [level=2] [ref=e177]
      - generic [ref=e178]:
        - generic [ref=e179]:
          - heading "WHERE THE BASELINE WINS" [level=3] [ref=e180]
          - paragraph [ref=e181]: "For breadth, the incumbent wins outright: PJSIP ships forking, presence, TCP/TLS, every codec and two decades of field hardening. A general-purpose communications product should use PJSIP; the only claim here is about the size of the load-bearing subset (E-008)."
        - generic [ref=e182]:
          - heading "WHAT IS UNTESTED" [level=3] [ref=e183]
          - paragraph [ref=e184]: Interop is proven against exactly one PBX (a pinned Asterisk 20); media is one client against Asterisk's Echo() with no second real endpoint; only UDP and PCMU are implemented, so a PBX that demands TLS or another codec will not complete the suite (R-001, R-002, R-004).
        - generic [ref=e185]:
          - heading "WHAT WOULD MOVE IT FORWARD" [level=3] [ref=e186]
          - paragraph [ref=e187]: "The next readiness level needs a production-like environment: a second real endpoint, a load generator, sustained multi-call traffic, and monitoring. Nothing in this suite provides those yet."
        - generic [ref=e188]:
          - heading "BUILT-IN COSTS" [level=3] [ref=e189]
          - paragraph [ref=e190]: The client is a measurement instrument first. An engineer solving the call problem with PJSIP loses nothing by using SIP — the point of this repository is the 16.7% and the matrix behind it, not the client.
    - generic [ref=e191]:
      - heading "Should you use it?" [level=2] [ref=e192]
      - paragraph [ref=e193]:
        - strong [ref=e194]: Engineers who want to know which parts of a 300-page protocol are actually load-bearing for an ordinary client scenario — and anyone building a minimal SIP endpoint (embedded, scenario-based, or educational) who wants the auditable statement-by-statement list.
      - paragraph [ref=e195]:
        - strong [ref=e196]: "Not for:"
        - text: "Not a library for a general-purpose product: no forking, no TLS, one codec, one proven PBX. And not a tutorial — it is a measurement with a working example attached."
