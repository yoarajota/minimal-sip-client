services:
  asterisk:
    image: andrius/asterisk:20.7-cert11_debian-trixie
    volumes:
      - ./poc/asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./poc/asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./poc/asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro

  client:
    image: golang:1.22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - go test -tags integration -v ./internal/sip/ -run TestSuiteIntegration
    environment:
      SIP_SERVER: "asterisk:5060"
      SIP_DOMAIN: "asterisk"
      SIP_USER: alice
      SIP_PASS: secret
      SIP_EXT: "100"
    depends_on:
      - asterisk

  # The PJSIP 2.17 baseline (bench/baseline/Dockerfile): the incumbent's own
  # pjsua2 API completing the same scenario suite (bench/run.sh leg 2).
  baseline:
    image: minimal-sip-baseline:pjsua-2.17
    environment:
      SIP_SERVER: "asterisk:5060"
      SIP_DOMAIN: "asterisk"
      SIP_USER: alice
      SIP_PASS: secret
      SIP_EXT: "100"
    depends_on:
      - asterisk
